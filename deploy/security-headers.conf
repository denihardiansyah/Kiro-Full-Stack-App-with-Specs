# Shared response headers.
#
# nginx does not inherit add_header into a location that declares its own
# add_header directives, so every location includes this file explicitly.
# 'unsafe-inline' in script-src is required by the small inline bootstrap
# script in index.html that sets the `js` class before first paint.
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
