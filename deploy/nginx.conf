worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Container logs go to stdout/stderr so they land in CloudWatch Logs.
  log_format main '$remote_addr - $status "$request" $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # The unprivileged image cannot write to /var/cache/nginx.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   512;
  # nginx 1.25+ maps .js to text/javascript, so both types are listed.
  gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # ALB target group health check target. Kept out of the access log.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # No favicon is shipped; answer directly instead of returning the HTML page.
    location = /favicon.ico {
      access_log off;
      return 204;
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600" always;
    }

    # Single-page guide: unknown paths fall back to the document itself.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
